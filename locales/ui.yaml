# spl/tools.py (the book.* keys). See docs/DEV/readme-i18n.md §2a.
#
# YAML pitfalls: quote values that start with { [ : @, and quote language
# codes that YAML 1.1 reads as booleans (no, yes, on, off).

_meta:
  source: en
  # The top-bar language picker lists these, in this order.
